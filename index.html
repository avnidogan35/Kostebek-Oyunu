<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Köstebek Yakalama</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Arka plan dekoratif bulut/daireler */
        .bg-circle {
            position: absolute;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .c1 { width: 140px; height: 140px; top: 3%; left: -30px; }
        .c2 { width: 180px; height: 180px; top: 15%; right: -50px; }
        .c3 { width: 100px; height: 100px; bottom: 10%; left: 5%; }

        .game-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* Üst Bilgi Kartları */
        .stats-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: #ffffff;
            border-radius: 22px;
            padding: 12px 16px;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.08);
            border: 3px solid #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card.score-card {
            background: #fffde7;
        }

        .stat-card.time-card {
            background: #fce4ec;
        }

        .stat-label {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .score-card .stat-label { color: #f57f17; }
        .time-card .stat-label { color: #d81b60; }

        .stat-value {
            font-size: 28px;
            font-weight: 900;
            color: #263238;
            line-height: 1.1;
        }

        .best-score {
            font-size: 12px;
            font-weight: 700;
            color: #78909c;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Yeşil Oyun Alanı */
        .board-container {
            width: 100%;
            background: #69f0ae;
            background: linear-gradient(180deg, #69f0ae 0%, #00e676 100%);
            border-radius: 32px;
            padding: 22px 18px 20px 18px;
            box-shadow: 0 12px 0 #00c853, 0 18px 25px rgba(0, 0, 0, 0.15);
            border: 4px solid #b9f6ca;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 9 Delikli Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 14px;
            width: 100%;
            margin-bottom: 22px;
        }

        .hole {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 0.85;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            cursor: pointer;
        }

        /* Delik Çerçevesi ve İç Karanlık */
        .hole-rim {
            width: 92%;
            height: 46%;
            background: #263238;
            border-radius: 50%;
            border-bottom: 6px solid #00bfa5;
            box-shadow: inset 0 8px 10px rgba(0, 0, 0, 0.7), 0 4px 6px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 1;
        }

        /* Köstebek Maskeleme Alanı */
        .mole-mask {
            position: absolute;
            bottom: 12%;
            width: 82%;
            height: 88%;
            overflow: hidden;
            border-radius: 0 0 45% 45%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Köstebek Karakteri */
        .mole {
            width: 78%;
            height: 85%;
            background: #d79a63;
            background: radial-gradient(circle at 35% 30%, #e6b07e, #b8773d);
            border-radius: 50% 50% 20% 20%;
            border: 3px solid #3e2723;
            position: relative;
            transform: translateY(105%);
            transition: transform 0.16s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 18%;
        }

        .hole.up .mole {
            transform: translateY(5%);
        }

        /* Köstebek Yüz Detayları */
        .mole-eyes {
            display: flex;
            gap: 14px;
            margin-bottom: 4px;
        }

        .eye {
            width: 7px;
            height: 7px;
            background: #212121;
            border-radius: 50%;
            position: relative;
        }

        .eye::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            width: 2.5px;
            height: 2.5px;
            background: #fff;
            border-radius: 50%;
        }

        .mole-nose {
            width: 14px;
            height: 9px;
            background: #ff7043;
            border-radius: 50%;
            border: 2px solid #3e2723;
        }

        .mole-cheeks {
            position: absolute;
            top: 38%;
            width: 80%;
            display: flex;
            justify-content: space-between;
        }

        .cheek {
            width: 8px;
            height: 5px;
            background: rgba(255, 82, 82, 0.5);
            border-radius: 50%;
        }

        /* Vurulma Efekti */
        .hole.bonked .mole {
            background: #ff8a65;
            transform: translateY(15%) scale(0.92);
        }

        /* Yanlış Tıklama Titreme Efekti */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.25s ease-in-out;
        }

        /* Alt Can (Kalp) Kutusu */
        .lives-pill {
            background: #ffffff;
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .heart {
            font-size: 20px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .heart.lost {
            opacity: 0.2;
            transform: scale(0.8);
            filter: grayscale(100%);
        }

        /* Başlangıç ve Oyun Bitti Ekranı */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(38, 50, 56, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
        }

        .modal {
            background: #ffffff;
            border-radius: 28px;
            padding: 28px 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 12px 0 #cfd8dc, 0 20px 30px rgba(0,0,0,0.3);
        }

        .modal h1 {
            font-size: 26px;
            color: #263238;
            margin-bottom: 10px;
        }

        .modal p {
            font-size: 15px;
            color: #546e7a;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .result-box {
            background: #f5f7f8;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
            color: #37474f;
            margin: 6px 0;
        }

        .btn-start {
            background: #00e676;
            color: #1b5e20;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #00c853;
            width: 100%;
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #00c853;
        }
    </style>
</head>
<body>

    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>

    <div class="game-wrapper">
        <!-- Üst Skor ve Süre Alanı -->
        <div class="stats-container">
            <div class="stat-card score-card">
                <span class="stat-label">SKOR</span>
                <span class="stat-value" id="score">0</span>
                <div class="best-score">🏆 Rekor: <span id="high-score">0</span></div>
            </div>
            <div class="stat-card time-card">
                <span class="stat-label">SÜRE</span>
                <span class="stat-value" id="timer">00:00</span>
                <div class="best-score" style="color:#ad1457;">Sınırsız Mod</div>
            </div>
        </div>

        <!-- Oyun Tahtası -->
        <div class="board-container" id="board">
            <div class="grid" id="grid">
                <!-- 9 Delik JS ile oluşturulacak -->
            </div>

            <!-- 5 Can Göstergesi -->
            <div class="lives-pill" id="lives-container">
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
            </div>
        </div>
    </div>

    <!-- Başlangıç / Bitiş Penceresi -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <h1 id="modal-title">Köstebek Avı</h1>
            <p id="modal-desc">Çıkan köstebeklere hızlıca dokun! Boş deliğe basarsan veya köstebeği kaçırırsan 1 can kaybedersin.</p>
            
            <div class="result-box" id="result-box">
                <div class="result-row">
                    <span>Skorun:</span>
                    <span id="final-score">0</span>
                </div>
                <div class="result-row">
                    <span>Dayanma Süren:</span>
                    <span id="final-time">00:00</span>
                </div>
                <div class="result-row" style="color: #f57f17;">
                    <span>En Yüksek Skor:</span>
                    <span id="final-best">0</span>
                </div>
            </div>

            <button class="btn-start" id="start-btn">OYUNA BAŞLA</button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const timerEl = document.getElementById('timer');
        const livesContainer = document.getElementById('lives-container');
        const boardEl = document.getElementById('board');
        const overlay = document.getElementById('overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const resultBox = document.getElementById('result-box');
        const finalScoreEl = document.getElementById('final-score');
        const finalTimeEl = document.getElementById('final-time');
        const finalBestEl = document.getElementById('final-best');
        const startBtn = document.getElementById('start-btn');

        let holes = [];
        let score = 0;
        let highScore = localStorage.getItem('kostebekRekor') || 0;
        let lives = 5;
        let seconds = 0;
        let isPlaying = false;
        let lastHoleIndex = -1;
        let moleTimeout = null;
        let timerInterval = null;

        highScoreEl.textContent = highScore;

        // 9 Deliğin HTML yapısını oluştur
        for (let i = 0; i < 9; i++) {
            const hole = document.createElement('div');
            hole.classList.add('hole');
            hole.dataset.index = i;
            hole.dataset.active = 'false';

            hole.innerHTML = `
                <div class="hole-rim"></div>
                <div class="mole-mask">
                    <div class="mole">
                        <div class="mole-eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="mole-cheeks">
                            <div class="cheek"></div>
                            <div class="cheek"></div>
                        </div>
                        <div class="mole-nose"></div>
                    </div>
                </div>
            `;

            // Dokunma / Tıklama olayı
            hole.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                handleHoleTap(hole);
            });

            grid.appendChild(hole);
            holes.push(hole);
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateLivesUI() {
            const hearts = livesContainer.querySelectorAll('.heart');
            hearts.forEach((h, idx) => {
                if (idx < lives) {
                    h.classList.remove('lost');
                } else {
                    h.classList.add('lost');
                }
            });
        }

        function loseLife() {
            if (!isPlaying) return;
            lives--;
            updateLivesUI();

            // Ekran titreme efekti
            boardEl.classList.remove('shake');
            void boardEl.offsetWidth;
            boardEl.classList.add('shake');

            if (lives <= 0) {
                endGame();
            }
        }

        function handleHoleTap(hole) {
            if (!isPlaying) return;

            if (hole.dataset.active === 'true') {
                // Köstebeği vurdu!
                hole.dataset.active = 'false';
                hole.classList.add('bonked');
                
                score++;
                scoreEl.textContent = score;

                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('kostebekRekor', highScore);
                }

                setTimeout(() => {
                    hole.classList.remove('up', 'bonked');
                }, 140);

            } else {
                // Yanlış/boş deliğe dokundu!
                loseLife();
            }
        }

        function randomHole() {
            const idx = Math.floor(Math.random() * holes.length);
            if (idx === lastHoleIndex) {
                return randomHole();
            }
            lastHoleIndex = idx;
            return holes[idx];
        }

        function peep() {
            if (!isPlaying) return;

            // Skor arttıkça hızlanma
            const minTime = Math.max(450, 950 - score * 12);
            const maxTime = Math.max(700, 1350 - score * 15);
            const stayDuration = Math.floor(Math.random() * (maxTime - minTime) + minTime);

            const hole = randomHole();
            hole.classList.remove('bonked');
            hole.classList.add('up');
            hole.dataset.active = 'true';

            setTimeout(() => {
                // Süre dolduğunda köstebek hala vurulmadıysa can gider
                if (hole.dataset.active === 'true' && isPlaying) {
                    hole.dataset.active = 'false';
                    hole.classList.remove('up');
                    loseLife();
                }

                if (isPlaying) {
                    const nextDelay = Math.max(200, 450 - score * 5);
                    moleTimeout = setTimeout(peep, nextDelay);
                }
            }, stayDuration);
        }

        function startGame() {
            score = 0;
            lives = 5;
            seconds = 0;
            isPlaying = true;
            lastHoleIndex = -1;

            scoreEl.textContent = '0';
            timerEl.textContent = '00:00';
            updateLivesUI();

            holes.forEach(h => {
                h.classList.remove('up', 'bonked');
                h.dataset.active = 'false';
            });

            overlay.style.display = 'none';

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                timerEl.textContent = formatTime(seconds);
            }, 1000);

            clearTimeout(moleTimeout);
            setTimeout(peep, 500);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            clearTimeout(moleTimeout);

            holes.forEach(h => {
                h.classList.remove('up', 'bonked');
                h.dataset.active = 'false';
            });

            modalTitle.textContent = 'Oyun Bitti!';
            modalDesc.textContent = 'Tüm canların tükendi. Tekrar denemek ister misin?';
            resultBox.style.display = 'block';
            finalScoreEl.textContent = score;
            finalTimeEl.textContent = formatTime(seconds);
            finalBestEl.textContent = highScore;
            startBtn.textContent = 'TEKRAR OYNA';

            overlay.style.display = 'flex';
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
